let db=load(), view=new Date(), openId=null, cat='pf';
function load(){try{const x=JSON.parse(localStorage.getItem(K)); if(x&&x.bulls) return x;}catch(e){} return {bulls:SEED.map(b=>({...b})),appts:[]};}
function save(){localStorage.setItem(K,JSON.stringify(db))}
function stars(n){n=+n||0;return '★'.repeat(n)+'☆'.repeat(5-n)}

function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));}

 const q=(document.getElementById('q').value||'').toLowerCase();
 const rows=db.bulls.filter(b=>b.cat===cat && (b.name+' '+b.city+' '+(b.spec||[]).join(' ')).toLowerCase().includes(q));
 document.getElementById('list').innerHTML=rows.map(b=>`
  <button class="card" onclick="openBull('${b.id}')">${img(b)}<div>
   <b>${b.name}</b> <span class="stars">${stars(b.rating)}</span>
   <div class="meta">${b.age} · ${b.city} · ${b.h||'—'}cm · ${b.build||''} · ${b.cm||'—'}cm</div>
   <div>${(b.spec||[]).map(s=>`<span class="chip">${s}</span>`).join('')}</div>
  </div></button>`).join('')||'<p class="meta">Nessun bull in questa rubrica.</p>';
}
function openBull(id){
 openId=id; const b=db.bulls.find(x=>x.id===id); if(!b) return;
 const mine=db.appts.filter(a=>a.bullId===id).sort((a,c)=>a.start-c.start);
 document.getElementById('detail').innerHTML=`<div class="card" style="display:block">

  <div class="row">${[1,2,3,4,5].map(n=>`<button class="btn ${b.rating===n?'':'g'}" onclick="rate('${id}',${n})">${n}★</button>`).join('')}</div>

function rate(id,n){const b=db.bulls.find(x=>x.id===id); if(!b)return; b.rating=n; save(); openBull(id); renderList();}
function overlap(s,e){return db.appts.find(a=>s<a.end && a.start<e)}
function book(id){
 const when=document.getElementById('d_when').value; if(!when) return toast('Scegli data e ora');
 const start=new Date(when).getTime(), end=start+(+document.getElementById('d_dur').value)*60000;
 const hit=overlap(start,end);
 if(hit){const o=db.bulls.find(b=>b.id===hit.bullId); return toast('Occupata: '+(o?o.name:'altro')+' '+fmt(hit.start));}

 let html=['L','M','M','G','V','S','D'].map(n=>`<b>${n}</b>`).join('')+'<i></i>'.repeat(off);

 for(let d=1;d<=days;d++){const day=new Date(y,m,d).getTime(), next=day+86400000; const busy=db.appts.some(a=>a.start<next&&a.end>day); html+=`<span class="${busy?'busy':''}">${d}</span>`;}

 document.getElementById('agenda').innerHTML=db.appts.slice().sort((a,b)=>a.start-b.start).map(a=>{const b=db.bulls.find(x=>x.id===a.bullId); return `<div class="card"><div><b>${b?b.name:'?'}</b><div class="meta">${fmt(a.start)} → ${fmt(a.end)} · ${a.place||'—'}</div></div><button class="btn g" onclick="delAp('${a.id}')">x</button></div>`;}).join('')||'<p class="meta">Nessuno slot.</p>';
}
