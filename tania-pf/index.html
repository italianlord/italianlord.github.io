<!DOCTYPE html>

{id:'m3',name:'Luca Ferre',age:38,city:'Bologna',h:190,build:'slanciato',cm:21,spec:['dirty talk','hair pull','overstim'],rating:0},
{id:'m4',name:'Hassan K.',age:29,city:'Torino',h:185,build:'cut',cm:18,spec:['edging','oral lungo'],rating:0},

let db; try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!db||!db.bulls) db={bulls:SEED.map(b=>({...b})),appts:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const stars=n=>'★'.repeat(n||0)+'☆'.repeat(5-(n||0));
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));}
function renderList(){const q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('list').innerHTML=db.bulls.filter(b=>(b.name+b.city+(b.spec||[]).join(' ')).toLowerCase().includes(q)).map(b=>`<div class="card"><b>${b.name}</b> <span class="stars">${stars(b.rating)}</span><div>${b.age} · ${b.city} · ${b.cm}cm</div><div>${(b.spec||[]).join(' · ')}</div><div>${[1,2,3,4,5].map(n=>`<button class="btn" onclick="rate('${b.id}',${n})">${n}★</button>`).join(' ')} <button class="btn" onclick="book('${b.id}')">Prenota 90m ora</button></div></div>`).join('');}
function rate(id,n){const b=db.bulls.find(x=>x.id===id);if(!b)return;b.rating=n;save();renderList();}
function overlap(s,e){return db.appts.find(a=>s<a.end&&a.start<e)}
function book(id){const start=Date.now()+3600000;const end=start+90*60000;const hit=overlap(start,end);if(hit){alert('Occupata con un altro bull');return;}db.appts.push({id:'a'+Date.now(),bullId:id,start,end,place:'casa'});save();alert('Prenotato');renderCal();}
function renderCal(){document.getElementById('agenda').innerHTML=db.appts.map(a=>{const b=db.bulls.find(x=>x.id===a.bullId);return `<div class="card">${b?b.name:'?'} · ${new Date(a.start).toLocaleString('it-IT')}</div>`}).join('')||'<p>Nessuno slot.</p>';}
document.getElementById('enter').onclick=()=>{document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';renderList();renderCal();};
document.getElementById('q').oninput=renderList;
document.getElementById('saveb').onclick=()=>{const name=document.getElementById('n_name').value.trim();if(!name)return;db.bulls.unshift({id:'c'+Date.now(),name,age:30,city:'',h:180,build:'',cm:0,spec:[],rating:0});save();show('bulls');renderList();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{show(b.dataset.tab);if(b.dataset.tab==='cal')renderCal();if(b.dataset.tab==='bulls')renderList();});
</script>
</body>
</html>
